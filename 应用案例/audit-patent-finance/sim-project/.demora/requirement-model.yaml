# 需求模型（Phase 1 写入，Phase 2 读取，Phase 3 判断变更）
# Schema 见 SKILL.md 内联定义
project:
  name: 知识产权金融一体化智能评估质押系统
  description: 专利估值、质押、放款与风险监控一体化平台
  domain: Patent
  slug: patent-finance

entities:
  - name: pledge-case
    displayName: 质押案件
    fields:
      - name: case_no
        displayName: 案件编号
        type: string
        required: true
      - name: applicant
        displayName: 申请人
        type: string
        required: true
      - name: pledge_patents
        displayName: 质押专利清单
        type: text
        required: true
      - name: assessed_value
        displayName: 评估价值（万元）
        type: number
        required: true
      - name: loan_amount
        displayName: 贷款金额（万元）
        type: number
        required: true
      - name: bank
        displayName: 受托银行
        type: enum
        options: [工商银行, 建设银行, 招商银行, 广州银行]
        required: true
      - name: operator
        displayName: 操作人
        type: string
        required: false
    statuses:
      - value: applied
        label: 已申请
        color: warning
      - value: assessing
        label: 评估中
        color: info
      - value: approved
        label: 已审批
        color: info
      - value: registered
        label: 已登记
        color: info
      - value: disbursed
        label: 已放款
        color: success
      - value: repaid
        label: 已还款
        color: success
    transitions: []
    relations: []

pages:
  - id: P01
    name: pledge-case-list
    type: crud_list
    entity: pledge-case
    route: /pledge-cases
    priority: P0
    fields:
      - field: case_no
        in_search: true
        in_table: true
      - field: applicant
        in_search: true
        in_table: true
      - field: assessed_value
        in_search: false
        in_table: true
      - field: loan_amount
        in_search: false
        in_table: true
      - field: bank
        in_search: true
        in_table: true
      - field: status
        in_search: true
        in_table: true
    operations:
      - name: 新增案件
        type: create
        trigger: 点击新增按钮
        condition: 用户拥有 pledge-case:create 权限
        feedback: 跳转到质押申请表单
      - name: 查看案件
        type: view
        trigger: 点击表格行查看按钮
        condition: 用户拥有 pledge-case:read 权限
        feedback: 跳转到案件详情
      - name: 导出台账
        type: export
        trigger: 点击"导出台账"按钮
        condition: 用户拥有 pledge-case:export 权限
        feedback: 导出质押案件 Excel 台账
    annotations:
      L1:
        summary: 质押案件列表页，分页展示全部质押案件
        entry: 侧边栏"质押案件"菜单
        precondition: 已登录且拥有 pledge-case:read 权限
        data_entity: pledge-case
        business_rules:
          - 企业融资经理仅查看本企业案件
          - 银行风控可见本行案件
          - 评估师可见全部
        test_data: 6 条案件 Mock 数据，覆盖各银行与状态
      L2:
        - zone: 搜索区
          description: 顶部搜索表单，含案件编号、申请人、银行、状态下拉与搜索按钮
        - zone: 操作栏
          description: 含新增案件、导出台账按钮
        - zone: 数据表格
          description: 数据表格 展示案件列表，银行与状态使用 状态标签
        - zone: 分页区
          description: 底部 分页组件
      L3:
        - element: 搜索按钮
          function: 触发搜索
          trigger: click
          condition: 无
          response: 表格刷新为搜索结果
          state: 搜索条件已应用
          exception: 搜索条件为空时展示全部
        - element: 新增案件按钮
          function: 打开新增表单
          trigger: click
          condition: 用户拥有 pledge-case:create 权限
          response: 跳转到 /pledge-cases/form
          state: 表单页面加载
          exception: 无权限时按钮隐藏
        - element: 导出台账按钮
          function: 导出质押台账
          trigger: click
          condition: 用户拥有 pledge-case:export 权限
          response: 下载 Excel 台账
          state: 无状态变更
          exception: 无权限时按钮隐藏
  - id: P02
    name: pledge-case-detail
    type: detail_view
    entity: pledge-case
    route: /pledge-cases/:id
    priority: P0
    fields:
      - field: case_no
        in_detail: true
      - field: applicant
        in_detail: true
      - field: pledge_patents
        in_detail: true
      - field: assessed_value
        in_detail: true
      - field: loan_amount
        in_detail: true
      - field: bank
        in_detail: true
      - field: status
        in_detail: true
    operations:
      - name: 启动评估
        type: update
        trigger: 点击"启动评估"按钮
        condition: 用户拥有 pledge-case:update 权限且角色为评估师且状态为已申请
        feedback: 调用 AI 估值，状态置为评估中
      - name: 审批
        type: confirm
        trigger: 点击"审批"按钮
        condition: 用户拥有 pledge-case:update 权限且角色为银行风控且状态为评估中
        feedback: 弹出审批意见弹窗，确认后置为已审批
      - name: 放款
        type: finish
        trigger: 点击"放款"按钮
        condition: 用户拥有 pledge-case:update 权限且角色为银行风控且状态为已登记
        feedback: 状态置为已放款
    annotations:
      L1:
        summary: 案件详情页，展示质押专利、估值与放款流程
        entry: 案件列表点击"查看"
        precondition: 已登录且拥有 pledge-case:read 权限
        data_entity: pledge-case
        business_rules:
          - 状态流转：已申请 → 评估中 → 已审批 → 已登记 → 已放款 → 已还款
          - 单笔质押贷款不超过评估价值的 70%
          - 已质押专利不可重复质押
        test_data: 1 条案件详情 Mock 数据，含质押专利清单与估值明细
      L2:
        - zone: 详情头部
          description: 描述列表 展示案件编号、申请人、银行、状态
        - zone: 质押专利区
          description: 展示质押专利清单与各专利估值
        - zone: 估值与贷款区
          description: 展示评估价值、贷款金额、贴息匹配结果
        - zone: 操作按钮区
          description: 含启动评估、审批、放款按钮（按状态显示）
      L3:
        - element: 启动评估按钮
          function: 触发 AI 估值
          trigger: click
          condition: 角色为评估师且状态为已申请
          response: 状态更新为评估中
          state: 按钮组刷新
          exception: 非已申请状态按钮隐藏
        - element: 审批按钮
          function: 审批质押案件
          trigger: click
          condition: 角色为银行风控且状态为评估中
          response: 弹出审批意见弹窗
          state: 弹窗显示
          exception: 非评估中状态按钮隐藏
        - element: 放款按钮
          function: 执行放款
          trigger: click
          condition: 角色为银行风控且状态为已登记
          response: 状态置为已放款
          state: 按钮组刷新
          exception: 非已登记状态按钮隐藏
  - id: P03
    name: pledge-case-apply
    type: form_page
    entity: pledge-case
    route: /pledge-cases/form
    priority: P0
    fields:
      - field: case_no
        in_form: true
      - field: applicant
        in_form: true
      - field: pledge_patents
        in_form: true
      - field: loan_amount
        in_form: true
      - field: bank
        in_form: true
    operations:
      - name: 提交申请
        type: save
        trigger: 点击提交按钮
        condition: 表单校验通过
        feedback: 提交后返回案件列表，状态为已申请
      - name: AI 估值
        type: update
        trigger: 点击"AI 估值"按钮
        condition: 质押专利清单已填
        feedback: 调用 AI 估值模型，输出建议估值
      - name: 取消
        type: cancel
        trigger: 点击取消按钮
        condition: 无
        feedback: 返回上一页
    annotations:
      L1:
        summary: 质押申请表单页，融资经理发起质押申请
        entry: 案件列表点击"新增案件"
        precondition: 已登录且拥有 pledge-case:create 权限
        data_entity: pledge-case
        business_rules:
          - 案件编号、申请人、质押专利清单、贷款金额、银行为必填
          - 贷款金额不超过评估价值的 70%
          - 已质押专利不可重复质押
        test_data: 空表单或回填的案件数据
      L2:
        - zone: 表单区
          description: 表单 含案件编号、申请人、质押专利清单、贷款金额、银行字段
        - zone: 操作按钮区
          description: 含 AI 估值、提交、取消按钮
      L3:
        - element: 提交按钮
          function: 提交质押申请
          trigger: click
          condition: 表单校验通过
          response: 保存数据并跳转 /pledge-cases
          state: 列表页刷新
          exception: 贷款金额超过估值 70% 时高亮错误
        - element: AI 估值按钮
          function: 调用 AI 估值
          trigger: click
          condition: 质押专利清单已填
          response: 自动填充建议估值
          state: 估值字段更新
          exception: 已质押专利重复时提示错误
        - element: 取消按钮
          function: 取消编辑
          trigger: click
          condition: 无
          response: 返回上一页
          state: 不保存任何修改
          exception: 无

roles:
  - name: financing-manager
    displayName: 企业融资经理
    permissions:
      - entity: pledge-case
        actions: [create, read, update]
        scope: own
    page_visibility: [P01, P02, P03]
  - name: bank-risk
    displayName: 银行风控
    permissions:
      - entity: pledge-case
        actions: [read, update, export]
        scope: all
    page_visibility: [P01, P02]
  - name: assessor
    displayName: 评估师
    permissions:
      - entity: pledge-case
        actions: [read, update]
        scope: all
    page_visibility: [P01, P02]
