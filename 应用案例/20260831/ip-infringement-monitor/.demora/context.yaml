# 跨会话上下文（领域术语、组件清单、样式约束快照）
domain_terms:
  侵权线索: "爬虫在多渠道命中涉嫌侵犯专利权的商品记录，是监测与取证的对象"
  存证取证: "把侵权页面快照、录屏与购买凭证固化为证据并写入区块链的过程"
  存证时效: "监测命中后 24 小时内必须完成存证的硬性窗口，超时证据失效"
  区块链存证: "生成存证哈希与区块高度并写入时间戳，作为司法举证凭证"
  分级处置: "按侵权严重程度选择平台投诉函、律师函、专利无效检索或诉讼前置"
  跨境规则模板: "各国各平台投诉渠道、响应时效与材料清单的合规配置"
  下架率: "结案案件中处置结果为已下架的比例，用于衡量维权效果"
component_inventory:
  - "app-shell：常驻 topbar + 可折叠 sidebar + 单容器业务滚动区"
  - "时效环（ring）：SVG 进度环，按 24 小时窗口收敛，危险态转朱红"
  - "证据链时间轴：快照 / 录屏 / 上链 三类节点，可按类型过滤"
  - "统计条：当前结果计数与状态分档，计数与表格可见行数一致"
  - "筛选栅格：关键词 + 渠道 + 风险 + 状态组合筛选，与分页状态位独立"
  - "弹窗：存证 / 立案 / 监测任务 / 跨境规则，遮罩 pointer-events 穿透"
style_constraints:
  主题: "司法卷宗风：深墨蓝 #101C2B、纸白 #F4F6F8、封条朱红 #C4362F、链上蓝 #2E6BE6、黄铜 #B4842A"
  字体: "衬线（Georgia / 宋体）标题与关键数值，系统无衬线正文，等宽字体承载专利号与存证哈希"
  圆角: "4px 小圆角，卡片留白克制，避免装饰性阴影"
  禁止: "不使用暖奶油衬线、近黑酸性色、报纸式三种默认审美；不在弹窗内放置标注锚点"
# v5.0 新增：标记 AI 是否已读取 frontend-design 方法论
design_methodology_read: true
