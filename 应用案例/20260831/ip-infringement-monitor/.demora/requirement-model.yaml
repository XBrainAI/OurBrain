# 需求模型（Phase 1 由 AI 与 PM 对话填充，Phase 2 锁定后只读）
project:
  name: "线上侵权监测与维权取证系统"
  description: "面向品牌方面向电商/1688/跨境/短视频/展会渠道的 AI 侵权监测、区块链存证取证与分级维权处置一体化平台"
  domain: "IPR"
  # v5.11: 英文 slug，用于公网发布路径 https://demora.ipsunlight.com/<slug>/
  # 留空时 package-delivery 会按字典/拼音/兜底策略自动生成
  # 格式：小写字母开头，仅含小写字母/数字/连字符，3-64 字符
  slug: "ip-infringement-monitor"
  name_en: "Online IP Infringement Monitoring and Evidence Platform"
entities:
  - name: "InfringementLead"
    displayName: "侵权线索"
    fields:
      - name: "leadNo"
        displayName: "线索编号"
        type: "string"
        required: true
      - name: "patentNo"
        displayName: "专利号"
        type: "string"
        required: true
        validation:
          pattern: "^[A-Z]{2}\\d{6,}"
      - name: "patentTitle"
        displayName: "专利名称"
        type: "string"
        required: true
      - name: "itemTitle"
        displayName: "涉嫌商品标题"
        type: "string"
        required: true
      - name: "channel"
        displayName: "侵权渠道"
        type: "enum"
        required: true
        options: ["电商平台", "独立站", "短视频", "展会", "跨境平台"]
      - name: "platform"
        displayName: "平台站点"
        type: "enum"
        required: true
        options: ["淘宝", "京东", "拼多多", "1688", "Amazon", "eBay", "Shopee", "Lazada", "Temu", "抖音", "独立站", "展会现场"]
      - name: "seller"
        displayName: "涉嫌卖家"
        type: "string"
        required: true
      - name: "shopUrl"
        displayName: "商品链接"
        type: "string"
      - name: "similarity"
        displayName: "相似度评分"
        type: "number"
        validation:
          min: 0
          max: 100
      - name: "riskLevel"
        displayName: "风险等级"
        type: "enum"
        required: true
        options: ["高", "中", "低"]
      - name: "hitCount"
        displayName: "命中商品数"
        type: "number"
      - name: "hitTime"
        displayName: "命中时间"
        type: "date"
        required: true
      - name: "evidenceDeadline"
        displayName: "存证截止时间"
        type: "date"
        required: true
      - name: "status"
        displayName: "线索状态"
        type: "enum"
        required: true
        options: ["待存证", "已存证", "已立案", "已失效", "已忽略"]
    statuses:
      - value: "PENDING_EVIDENCE"
        label: "待存证"
        color: "warning"
      - value: "EVIDENCED"
        label: "已存证"
        color: "info"
      - value: "FILED"
        label: "已立案"
        color: "primary"
      - value: "EXPIRED"
        label: "已失效"
        color: "danger"
      - value: "IGNORED"
        label: "已忽略"
        color: "info"
    transitions:
      - from: "PENDING_EVIDENCE"
        to: "EVIDENCED"
        trigger: "一键存证"
        condition: "命中后 24 小时内完成区块链存证"
      - from: "PENDING_EVIDENCE"
        to: "EXPIRED"
        trigger: "超时失效"
        condition: "超过存证截止时间仍未完成存证"
      - from: "EVIDENCED"
        to: "FILED"
        trigger: "发起立案"
        condition: "同一卖家同一专利无在办案件"
      - from: "PENDING_EVIDENCE"
        to: "IGNORED"
        trigger: "判定忽略"
        condition: "分析师复核为不侵权或重复线索"
    relations:
      - target: "EvidenceRecord"
        type: "one_to_many"
        description: "一条线索可多次取证，生成多条存证记录"
      - target: "RightsCase"
        type: "one_to_many"
        description: "一条线索立案后生成一个维权案件"
  - name: "EvidenceRecord"
    displayName: "存证记录"
    fields:
      - name: "evidenceNo"
        displayName: "存证编号"
        type: "string"
        required: true
      - name: "leadNo"
        displayName: "关联线索编号"
        type: "string"
        required: true
      - name: "method"
        displayName: "存证方式"
        type: "enum"
        required: true
        options: ["区块链存证", "录屏取证", "页面快照", "公证取证"]
      - name: "blockHash"
        displayName: "存证哈希"
        type: "string"
      - name: "blockHeight"
        displayName: "区块高度"
        type: "number"
      - name: "chainTime"
        displayName: "上链时间"
        type: "date"
      - name: "evidenceStatus"
        displayName: "证据状态"
        type: "enum"
        required: true
        options: ["存证中", "已上链", "已失效"]
      - name: "reportNo"
        displayName: "取证报告编号"
        type: "string"
      - name: "operator"
        displayName: "取证操作人"
        type: "string"
      - name: "fileCount"
        displayName: "证据文件数"
        type: "number"
    statuses:
      - value: "CHAINING"
        label: "存证中"
        color: "warning"
      - value: "ON_CHAIN"
        label: "已上链"
        color: "success"
      - value: "INVALID"
        label: "已失效"
        color: "danger"
    transitions:
      - from: "CHAINING"
        to: "ON_CHAIN"
        trigger: "上链成功"
        condition: "区块链网络返回存证哈希与时间戳"
      - from: "CHAINING"
        to: "INVALID"
        trigger: "存证失败"
        condition: "上链超时或证据文件缺失"
    relations:
      - target: "InfringementLead"
        type: "one_to_one"
        description: "存证记录归属唯一侵权线索"
  - name: "RightsCase"
    displayName: "维权案件"
    fields:
      - name: "caseNo"
        displayName: "案件编号"
        type: "string"
        required: true
      - name: "leadNo"
        displayName: "关联线索编号"
        type: "string"
        required: true
      - name: "patentNo"
        displayName: "涉案专利号"
        type: "string"
        required: true
      - name: "seller"
        displayName: "被诉卖家"
        type: "string"
        required: true
      - name: "strategy"
        displayName: "处置策略"
        type: "enum"
        required: true
        options: ["平台投诉函", "律师函", "专利无效检索", "诉讼前置"]
      - name: "region"
        displayName: "国家地区"
        type: "enum"
        required: true
        options: ["中国大陆", "美国", "欧盟", "英国", "日本", "东南亚"]
      - name: "platform"
        displayName: "受理平台"
        type: "string"
      - name: "ruleCode"
        displayName: "绑定规则模板"
        type: "string"
      - name: "status"
        displayName: "案件状态"
        type: "enum"
        required: true
        options: ["待处置", "处置中", "平台受理", "已结案", "已驳回"]
      - name: "owner"
        displayName: "责任角色"
        type: "enum"
        options: ["品牌方IPR", "维权律师", "监测分析师"]
      - name: "ownerName"
        displayName: "责任人"
        type: "string"
      - name: "createdAt"
        displayName: "立案时间"
        type: "date"
      - name: "closedAt"
        displayName: "结案时间"
        type: "date"
      - name: "outcome"
        displayName: "处置结果"
        type: "enum"
        options: ["已下架", "已整改", "诉讼中", "已驳回"]
      - name: "compensation"
        displayName: "维权收益"
        type: "number"
    statuses:
      - value: "PENDING"
        label: "待处置"
        color: "warning"
      - value: "PROCESSING"
        label: "处置中"
        color: "primary"
      - value: "ACCEPTED"
        label: "平台受理"
        color: "info"
      - value: "CLOSED"
        label: "已结案"
        color: "success"
      - value: "REJECTED"
        label: "已驳回"
        color: "danger"
    transitions:
      - from: "PENDING"
        to: "PROCESSING"
        trigger: "启动处置"
        condition: "已选定处置策略且跨境案件已绑定当地规则模板"
      - from: "PROCESSING"
        to: "ACCEPTED"
        trigger: "平台受理"
        condition: "平台返回受理回执"
      - from: "ACCEPTED"
        to: "CLOSED"
        trigger: "结案归档"
        condition: "侵权商品已下架或达成和解"
      - from: "PROCESSING"
        to: "REJECTED"
        trigger: "平台驳回"
        condition: "证据不足或权利不稳定"
      - from: "REJECTED"
        to: "PROCESSING"
        trigger: "补充证据重启"
        condition: "补充存证后重新提交"
    relations:
      - target: "InfringementLead"
        type: "one_to_one"
        description: "案件来源唯一侵权线索"
      - target: "CrossBorderRule"
        type: "one_to_one"
        description: "跨境案件绑定一条当地投诉规则模板"
  - name: "CrossBorderRule"
    displayName: "跨境规则模板"
    fields:
      - name: "ruleCode"
        displayName: "规则编号"
        type: "string"
        required: true
      - name: "region"
        displayName: "国家地区"
        type: "enum"
        required: true
        options: ["美国", "欧盟", "英国", "日本", "东南亚", "韩国"]
      - name: "platform"
        displayName: "适用平台"
        type: "enum"
        required: true
        options: ["Amazon", "eBay", "Shopee", "Lazada", "Temu", "AliExpress"]
      - name: "channel"
        displayName: "投诉渠道"
        type: "string"
      - name: "responseSla"
        displayName: "响应时效工作日"
        type: "number"
      - name: "materials"
        displayName: "材料清单"
        type: "text"
      - name: "templateName"
        displayName: "模板名称"
        type: "string"
      - name: "enabled"
        displayName: "启用状态"
        type: "boolean"
      - name: "boundCases"
        displayName: "已绑定案件数"
        type: "number"
      - name: "updatedAt"
        displayName: "更新时间"
        type: "date"
    statuses:
      - value: "ENABLED"
        label: "已启用"
        color: "success"
      - value: "DISABLED"
        label: "已停用"
        color: "info"
    transitions:
      - from: "ENABLED"
        to: "DISABLED"
        trigger: "停用规则"
        condition: "平台投诉渠道变更或规则过期"
      - from: "DISABLED"
        to: "ENABLED"
        trigger: "启用规则"
        condition: "规则内容复核通过"
pages:
  - id: "P01"
    name: "monitor-dashboard"
    type: "dashboard"
    entity: "InfringementLead"
    route: "/dashboard"
    priority: "P0"
    fields:
      - field: "leadNo"
        in_table: true
      - field: "patentNo"
        in_table: true
      - field: "seller"
        in_table: true
      - field: "riskLevel"
        in_table: true
      - field: "evidenceDeadline"
        in_table: true
      - field: "status"
        in_table: true
    operations:
      - name: "立即存证"
        type: "custom"
        trigger: "点击待办行存证按钮"
        condition: "线索状态为待存证且未超时"
        feedback: "弹出存证方式选择并生成存证编号与哈希"
      - name: "新建监测任务"
        type: "create"
        trigger: "点击新建监测任务按钮"
        condition: "当前用户为监测分析师或品牌方IPR"
        feedback: "弹出任务配置弹窗，提交后任务进入监测队列"
      - name: "渠道筛选"
        type: "read"
        trigger: "切换渠道下拉"
        condition: "无"
        feedback: "看板指标与待办列表按选中渠道重算"
    annotations:
      L1:
        summary: "侵权监测工作台是品牌方IPR 与监测分析师的每日作业入口，汇总监测命中的线索规模、24 小时存证时效倒计时待办、风险等级分布与渠道命中趋势，让用户一屏判断今天必须先处理哪些侵权线索。"
        entry: "系统首页默认落地页，左侧导航第一项；也可由其他页面点击品牌区返回。"
        precondition: "用户已登录并具备品牌方IPR、监测分析师或维权律师任一角色；系统已至少执行过一轮爬虫监测任务并产生线索数据。"
        data_entity: "InfringementLead、EvidenceRecord、RightsCase"
        business_rules:
          - "监测命中后 24 小时内必须完成存证，超时线索状态自动置为已失效"
          - "剩余时长大于 12 小时为正常，4 至 12 小时为警告，小于 4 小时为危险"
          - "风险等级为高或命中商品数大于等于 5 的线索立案时自动预选诉讼前置并指派维权律师"
        test_data: "内置 12 条线索：4 条待存证（含 1 条剩余 3 小时危险态、1 条超时失效）、3 条已存证、3 条已立案、2 条已忽略；覆盖电商/独立站/短视频/展会/跨境五类渠道。"
      L2:
        - id: "P01-L2-001"
          zone: "监测总览指标区"
          description: "以四张可点击指标卡展示待存证线索数、高风险案件数、已下架商品数与平均处置周期；数据由线索表按状态聚合、案件表按处置结果聚合实时计算，点击卡片可跳转对应清单并预置筛选条件。"
        - id: "P01-L2-002"
          zone: "存证时效待办区"
          description: "按剩余存证倒计时升序展示待处理线索，每行含线索编号、卖家、剩余时长与时效徽标；数据来源于线索表的存证截止时间字段与当前时间比对，倒计时归零后行状态自动变为已失效。"
        - id: "P01-L2-003"
          zone: "风险等级分布区"
          description: "以横向条形展示高中低三档风险线索的条数与占比；数据由线索表按风险等级分组统计，随渠道筛选条件联动重算，用于判断本期维权资源投入优先级。"
        - id: "P01-L2-004"
          zone: "渠道命中趋势区"
          description: "展示近七日各渠道侵权命中的趋势柱形，数据来源于线索表按命中日期与渠道分组聚合，用于识别仿冒集中爆发的渠道并调整监测任务频次。"
        - id: "P01-L2-005"
          zone: "快捷操作区"
          description: "提供新建监测任务、批量存证、导出日报三类高频动作入口；操作受角色权限约束，监测分析师可见全部，品牌方IPR 不可新建监测任务。"
      L3:
        - id: "P01-L3-001"
          element: "指标卡-待存证线索"
          function: "展示待存证线索总数并作为跳转入口"
          trigger: "点击指标卡"
          condition: "当前存在待存证状态线索"
          response: "跳转侵权线索清单页并自动按待存证状态筛选列表"
          state: "卡片处于可点击态，数量为 0 时显示为禁用样式"
          exception: "无待存证线索时点击不跳转并提示暂无待存证线索"
        - id: "P01-L3-002"
          element: "指标卡-高风险案件"
          function: "展示高风险线索与在办案件数并跳转案件中心"
          trigger: "点击指标卡"
          condition: "当前存在风险等级为高的线索"
          response: "跳转维权案件中心并自动按高风险筛选"
          state: "卡片常驻可点击，数值随数据变化刷新"
          exception: "数值为 0 时保持可点击但目标列表为空态"
        - id: "P01-L3-003"
          element: "指标卡-已下架商品"
          function: "展示已结案案件中处置结果为已下架的数量"
          trigger: "点击指标卡"
          condition: "存在处置结果为已下架的结案案件"
          response: "跳转维权效果统计页并定位渠道分布区块"
          state: "数值由案件表结案数据聚合得出"
          exception: "无结案案件时显示 0 且不跳转"
        - id: "P01-L3-004"
          element: "指标卡-平均处置周期"
          function: "展示从立案到结案的平均天数"
          trigger: "点击指标卡"
          condition: "存在至少一条已结案案件"
          response: "跳转维权效果统计页并高亮处置周期趋势"
          state: "数值取案件表立案时间与结案时间差值的算术平均"
          exception: "无结案案件时显示占位符并禁用点击"
        - id: "P01-L3-005"
          element: "待办行立即存证按钮"
          function: "对单条待存证线索发起区块链存证"
          trigger: "点击待办行存证按钮"
          condition: "线索状态为待存证且剩余时长大于零"
          response: "弹出存证方式选择弹窗，确认后生成存证编号与上链哈希，线索状态变更为已存证"
          state: "按钮为行内主操作，超时行显示为禁用态"
          exception: "线索已超时则按钮禁用并提示证据已失效无法存证"
        - id: "P01-L3-006"
          element: "待办行查看线索链接"
          function: "跳转到存证取证详情页查看线索与证据信息"
          trigger: "点击待办行查看链接"
          condition: "线索记录存在"
          response: "切换至存证取证详情页并载入该线索的存证信息"
          state: "链接常驻可点击"
          exception: "线索数据缺失时提示记录不存在"
        - id: "P01-L3-007"
          element: "渠道筛选下拉"
          function: "按侵权渠道过滤看板指标与待办列表"
          trigger: "切换下拉选项"
          condition: "存在该渠道的线索数据"
          response: "指标卡、风险分布、趋势与待办列表同步按渠道重算并更新计数"
          state: "默认选项为全部渠道"
          exception: "所选渠道无数据时列表显示空态提示"
        - id: "P01-L3-008"
          element: "新建监测任务按钮"
          function: "创建新的爬虫监测任务"
          trigger: "点击新建监测任务按钮"
          condition: "当前角色为监测分析师或品牌方IPR"
          response: "弹出任务配置弹窗，填写专利号与渠道后提交，任务进入监测队列并提示创建成功"
          state: "按钮位于快捷操作区常驻可点击"
          exception: "必填项未填写时阻断提交并提示缺失字段"
        - id: "P01-L3-009"
          element: "时效预警筛选标签"
          function: "按存证剩余时长档位筛选待办列表"
          trigger: "点击全部或警告或危险标签"
          condition: "待办列表非空"
          response: "待办列表仅显示符合所选档位的线索并更新计数"
          state: "默认选中全部，标签切换互斥"
          exception: "所选档位无数据时显示空态提示"
  - id: "P02"
    name: "infringement-leads"
    type: "crud_list"
    entity: "InfringementLead"
    route: "/leads"
    priority: "P0"
    fields:
      - field: "leadNo"
        in_search: true
        in_table: true
      - field: "patentNo"
        in_search: true
        in_table: true
        in_form: true
      - field: "itemTitle"
        in_table: true
        in_detail: true
      - field: "channel"
        in_search: true
        in_table: true
        in_form: true
      - field: "platform"
