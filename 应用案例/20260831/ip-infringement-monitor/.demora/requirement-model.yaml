        in_form: true
      - field: "seller"
        in_search: true
        in_table: true
        in_form: true
        in_detail: true
      - field: "riskLevel"
        in_search: true
        in_table: true
      - field: "similarity"
        in_table: true
        in_detail: true
      - field: "hitTime"
        in_table: true
      - field: "evidenceDeadline"
        in_table: true
      - field: "status"
        in_search: true
        in_table: true
    operations:
      - name: "立即存证"
        type: "custom"
        trigger: "点击行内存证按钮"
        condition: "线索状态为待存证且未超时"
        feedback: "生成存证记录，线索状态变更为已存证"
      - name: "发起立案"
        type: "create"
        trigger: "点击行内立案按钮"
        condition: "线索已存证且同一卖家同一专利无在办案件"
        feedback: "弹出立案弹窗，提交后生成维权案件"
      - name: "判定忽略"
        type: "update"
        trigger: "点击行内忽略按钮"
        condition: "线索未处于已立案状态"
        feedback: "线索状态变更为已忽略并从待办队列移除"
      - name: "批量存证"
        type: "batch"
        trigger: "勾选多行后点击批量存证"
        condition: "至少勾选一条待存证线索"
        feedback: "批量生成存证记录并刷新列表统计"
      - name: "导出线索"
        type: "export"
        trigger: "点击导出按钮"
        condition: "当前筛选结果非空"
        feedback: "导出当前筛选结果为 CSV 并提示导出条数"
    annotations:
      L1:
        summary: "侵权线索清单是监测命中的线索总库，支持按渠道、风险等级、状态与关键词组合筛选，分析师在此执行存证、忽略与批量处理，品牌方IPR 在此筛选可立案线索并发起维权案件。"
        entry: "左侧导航侵权线索；或由工作台指标卡、待办跳转进入并预置筛选条件。"
        precondition: "已完成至少一轮监测任务产生线索数据；用户具备监测分析师或品牌方IPR 角色。"
        data_entity: "InfringementLead、EvidenceRecord"
        business_rules:
          - "同一卖家同一专利不可重复立案，命中重复组合时阻断提交并提示已有案件编号"
          - "超过存证截止时间的线索状态为已失效，不可再执行存证操作"
          - "风险等级为高的线索在列表中置顶并按危险色高亮"
        test_data: "内置 14 条线索覆盖五类渠道、三档风险与五种状态，其中 2 条为超时失效态、3 条为同一卖家同一专利的重复组合用于验证立案拦截。"
      L2:
        - id: "P02-L2-001"
          zone: "筛选搜索区"
          description: "提供关键词、渠道、平台、风险等级、状态五组筛选控件与重置按钮；筛选条件由线索表字段实时匹配，所有条件为与关系组合，筛选后同步刷新统计条与分页。"
        - id: "P02-L2-002"
          zone: "线索统计条"
          description: "展示当前筛选结果总数及各状态分档数量，数据由线索表按筛选条件实时聚合；用于校验筛选是否生效，计数与表格可见行数始终保持一致。"
        - id: "P02-L2-003"
          zone: "线索数据表格区"
          description: "以表格展示线索编号、专利号、商品标题、渠道、平台、卖家、相似度、风险等级、命中时间、存证倒计时与状态；数据来源于线索表，行集随筛选与分页状态位全量重算。"
        - id: "P02-L2-004"
          zone: "批量操作区"
          description: "提供全选复选框与批量存证、导出按钮，勾选行后按钮由禁用转为可用；批量操作仅对状态为待存证的行生效，其余行在提交时自动跳过并计入跳过条数。"
        - id: "P02-L2-005"
          zone: "分页控制区"
          description: "提供每页条数选择、上一页下一页与页码跳转；分页与筛选使用互相独立的状态位，翻页不会丢失筛选条件，切页后列表计数与分页信息同步刷新。"
      L3:
        - id: "P02-L3-001"
          element: "关键词搜索输入框"
          function: "按专利号、商品标题或卖家模糊搜索线索"
          trigger: "在输入框逐键输入"
          condition: "输入内容非空"
          response: "表格行集按关键词实时过滤，统计条计数同步更新"
          state: "输入框为空时展示全部线索"
          exception: "无匹配结果时表格显示空态提示"
        - id: "P02-L3-002"
          element: "渠道筛选下拉"
          function: "按侵权渠道过滤线索列表"
          trigger: "切换下拉选项"
          condition: "存在该渠道线索"
          response: "列表仅显示所选渠道线索并刷新统计条与分页"
          state: "默认选项为全部渠道"
          exception: "该渠道无数据时列表为空态"
        - id: "P02-L3-003"
          element: "风险等级下拉"
          function: "按高中低风险等级过滤线索列表"
          trigger: "切换下拉选项"
          condition: "存在该等级线索"
          response: "列表按所选风险等级过滤并刷新计数"
          state: "默认选项为全部等级"
          exception: "该等级无数据时列表为空态"
        - id: "P02-L3-004"
          element: "状态筛选下拉"
          function: "按线索状态过滤列表"
          trigger: "切换下拉选项"
          condition: "存在该状态线索"
          response: "列表按所选状态过滤，切换为待存证时倒计时列高亮"
          state: "默认选项为全部状态"
          exception: "该状态无数据时列表为空态"
        - id: "P02-L3-005"
          element: "重置筛选按钮"
          function: "清空全部筛选条件恢复全量列表"
          trigger: "点击重置按钮"
          condition: "存在任一非默认筛选条件"
          response: "所有筛选控件恢复默认值，列表恢复全量并刷新计数"
          state: "无筛选条件时按钮为次要样式但仍可点击"
          exception: "已为默认状态时点击无副作用"
        - id: "P02-L3-006"
          element: "行内存证按钮（同类首个，其余 13 个实例共用本说明）"
          function: "对当前行线索发起区块链存证"
          trigger: "点击行内存证按钮"
          condition: "该行线索状态为待存证且未超时"
          response: "弹出存证方式选择，确认后生成存证编号与哈希，该行状态变更为已存证"
          state: "待存证行按钮可用，其余状态行按钮为禁用态"
          exception: "线索已超时则按钮禁用并提示证据已失效"
        - id: "P02-L3-007"
          element: "行内查看链接（同类首个，其余 13 个实例共用本说明）"
          function: "查看该行线索的存证取证详情"
          trigger: "点击行内查看链接"
          condition: "线索记录存在"
          response: "切换至存证取证详情页并载入该线索数据"
          state: "链接常驻可点击"
          exception: "数据缺失时提示记录不存在"
        - id: "P02-L3-008"
          element: "行内忽略按钮（同类首个，其余 13 个实例共用本说明）"
          function: "将当前行线索判定为忽略"
          trigger: "点击行内忽略按钮"
          condition: "该行线索未处于已立案状态"
          response: "该行状态变更为已忽略并移出待办队列，统计条分档数量同步更新"
          state: "已忽略行按钮为禁用态"
          exception: "已立案线索点击时提示需先结案案件"
        - id: "P02-L3-009"
          element: "全选复选框"
          function: "勾选或取消当前页全部可操作行"
          trigger: "点击表头复选框"
          condition: "当前页存在待存证行"
          response: "当前页待存证行全部进入勾选态，批量存证按钮转为可用"
          state: "已失效与已忽略行不参与勾选"
          exception: "当前页无待存证行时复选框禁用"
        - id: "P02-L3-010"
          element: "批量存证按钮"
          function: "对全部勾选线索批量发起存证"
          trigger: "点击批量存证按钮"
          condition: "至少勾选一条待存证线索"
          response: "批量生成存证记录，勾选行状态变更为已存证并提示成功与跳过条数"
          state: "未勾选时按钮禁用"
          exception: "勾选行全部不可存证时提示无可执行线索"
        - id: "P02-L3-011"
          element: "下一页按钮"
          function: "切换到下一页线索数据"
          trigger: "点击下一页按钮"
          condition: "存在下一页数据"
          response: "表格载入下一页行集，分页信息更新，筛选条件保持不变"
          state: "末页时按钮禁用"
          exception: "筛选后仅一页时按钮保持禁用"
  - id: "P03"
    name: "evidence-detail"
    type: "detail_view"
    entity: "EvidenceRecord"
    route: "/evidence"
    priority: "P0"
    fields:
      - field: "evidenceNo"
        in_detail: true
      - field: "leadNo"
        in_detail: true
      - field: "patentNo"
        in_detail: true
      - field: "seller"
        in_detail: true
      - field: "method"
        in_form: true
        in_detail: true
      - field: "blockHash"
        in_detail: true
      - field: "blockHeight"
        in_detail: true
      - field: "chainTime"
        in_detail: true
      - field: "evidenceStatus"
        in_detail: true
      - field: "reportNo"
        in_form: true
        in_detail: true
      - field: "operator"
        in_detail: true
    operations:
      - name: "发起存证"
        type: "create"
        trigger: "点击发起存证按钮"
        condition: "线索状态为待存证且未超时"
        feedback: "生成存证编号与哈希，证据状态由存证中转为已上链"
      - name: "生成取证报告"
        type: "export"
        trigger: "点击生成取证报告按钮"
        condition: "证据状态为已上链"
        feedback: "生成标准化取证报告编号并更新报告区"
      - name: "复制存证哈希"
        type: "read"
        trigger: "点击复制哈希按钮"
        condition: "已生成存证哈希"
        feedback: "哈希写入剪贴板并提示复制成功"
      - name: "发起立案"
        type: "create"
        trigger: "点击立案按钮"
        condition: "证据状态为已上链且无重复案件"
        feedback: "弹出立案弹窗，提交后生成维权案件"
    annotations:
      L1:
        summary: "存证取证详情页展示单条侵权线索的完整证据链，包含线索基本信息、区块链存证信息、取证过程时间轴与标准化取证报告，是分析师执行取证与律师核验证据效力的核心页面。"
        entry: "由线索清单行内查看链接进入；或在工作台待办点击查看进入。"
        precondition: "已选定一条侵权线索；该线索可处于待存证或已存证状态。"
        data_entity: "InfringementLead、EvidenceRecord"
        business_rules:
          - "存证完成前证据状态为存证中，上链成功后方可生成取证报告"
          - "存证哈希与时间轴一经上链不可修改，仅可追加后续取证动作"
          - "取证报告必须在证据状态为已上链后才可生成"
        test_data: "内置 11 条存证记录，覆盖四种存证方式、三种证据状态，含 1 条存证失败失效态与 1 条尚未存证的空态线索。"
      L2:
        - id: "P03-L2-001"
          zone: "线索基本信息区"
          description: "展示线索编号、专利号、专利名称、涉嫌商品标题、卖家与渠道平台等基础字段；数据来源于线索表关联查询，是判断侵权主体与权利基础是否匹配的依据。"
        - id: "P03-L2-002"
          zone: "区块链存证信息区"
          description: "展示存证编号、存证方式、存证哈希、区块高度与上链时间；数据由存证记录表与区块链服务返回值合成，哈希为司法举证的关键凭证。"
        - id: "P03-L2-003"
          zone: "证据链时间轴区"
          description: "按时间顺序展示监测命中、人工复核、发起存证、上链完成等节点，支持按证据类型切换时间轴视图；数据来源于存证记录的操作日志，用于证明取证过程连续未被篡改。"
        - id: "P03-L2-004"
          zone: "取证报告区"
          description: "展示取证报告编号、报告格式与生成状态，提供生成与下载入口；报告由存证哈希、时间轴与商品快照合成，仅在证据状态为已上链时可生成。"
        - id: "P03-L2-005"
          zone: "操作按钮区"
          description: "聚合返回清单、发起存证、复制哈希、生成报告与立案五类操作；按钮可用性由证据状态与角色权限共同决定，未满足条件时以禁用态呈现并 tooltip 说明原因。"
      L3:
        - id: "P03-L3-001"
          element: "返回线索清单链接"
          function: "返回侵权线索清单页"
          trigger: "点击返回链接"
          condition: "无"
          response: "切换回侵权线索清单页并保持此前的筛选条件"
          state: "链接常驻可点击"
          exception: "无历史筛选条件时返回全量列表"
        - id: "P03-L3-002"
          element: "存证方式下拉"
          function: "选择本次取证采用的存证方式"
          trigger: "切换下拉选项"
          condition: "线索未处于已失效状态"
          response: "选中的方式写入存证记录，报告区按方式展示对应材料说明"
          state: "默认选项为区块链存证"
          exception: "线索已失效时下拉禁用"
        - id: "P03-L3-003"
          element: "发起存证按钮"
          function: "对当前线索发起存证并写入区块链"
          trigger: "点击发起存证按钮"
          condition: "线索状态为待存证且剩余时长大于零"
          response: "生成存证编号与哈希，证据状态由存证中转为已上链，时间轴追加节点"
          state: "已上链时按钮切换为已完成禁用态"
          exception: "线索超时失效时按钮禁用并提示证据已失效"
        - id: "P03-L3-004"
          element: "复制存证哈希按钮"
          function: "复制存证哈希用于外部举证"
          trigger: "点击复制按钮"
          condition: "已生成存证哈希"
          response: "哈希写入剪贴板并提示复制成功"
          state: "未上链时按钮禁用"
          exception: "剪贴板不可用时提示手动复制"
        - id: "P03-L3-005"
          element: "证据链视图切换标签"
          function: "按证据类型切换时间轴视图"
          trigger: "点击全部或快照或录屏标签"
          condition: "时间轴存在该类型节点"
          response: "时间轴仅显示所选类型节点并更新节点计数"
          state: "默认选中全部，标签切换互斥"
          exception: "该类型无节点时时间轴显示空态"
        - id: "P03-L3-006"
          element: "报告格式下拉"
          function: "选择取证报告输出格式"
          trigger: "切换下拉选项"
          condition: "证据状态为已上链"
          response: "报告区展示所选格式的字段说明，生成按钮随之可用"
          state: "默认选项为标准版 PDF"
          exception: "未上链时下拉禁用"
        - id: "P03-L3-007"
          element: "生成取证报告按钮"
          function: "生成标准化取证报告"
          trigger: "点击生成报告按钮"
          condition: "证据状态为已上链且已选择报告格式"
          response: "生成报告编号并更新报告区状态为已生成，提示报告已就绪"
          state: "未上链时按钮禁用"
          exception: "上链失败时提示证据无效无法生成报告"
        - id: "P03-L3-008"
          element: "发起立案按钮"
          function: "基于已上链证据发起维权案件"
          trigger: "点击立案按钮"
          condition: "证据状态为已上链且同一卖家同一专利无在办案件"
          response: "弹出立案弹窗，提交后生成案件编号并跳转案件中心"
          state: "未上链时按钮禁用"
          exception: "命中重复卖家与专利组合时阻断提交并提示已有案件编号"
  - id: "P04"
    name: "rights-cases"
    type: "crud_list"
