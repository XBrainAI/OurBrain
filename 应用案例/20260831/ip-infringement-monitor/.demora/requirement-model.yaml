      - name: "驳回案件"
        type: "update"
        trigger: "点击行内驳回按钮"
        condition: "案件状态为处置中"
        feedback: "案件状态变更为已驳回并填写驳回原因"
      - name: "导出案件台账"
        type: "export"
        trigger: "点击导出按钮"
        condition: "当前筛选结果非空"
        feedback: "导出案件台账为 CSV 并提示导出条数"
    annotations:
      L1:
        summary: "维权案件中心承载从立案到结案的全流程跟踪，支持按处置策略、状态、责任人与地区筛选，并在此执行状态推进、律师升级与驳回处理，是分级处置规则落地的主页面。"
        entry: "左侧导航维权案件；或由线索清单立案、存证详情立案跳转进入。"
        precondition: "用户具备品牌方IPR 或维权律师角色；跨境案件已绑定对应地区规则模板。"
        data_entity: "RightsCase、CrossBorderRule、InfringementLead"
        business_rules:
          - "同一卖家同一专利不可重复立案，重复提交时阻断并提示已有案件编号"
          - "跨境案件必须绑定当地投诉规则模板后方可推进至处置中"
          - "高风险案件自动升级至维权律师，策略预选诉讼前置"
        test_data: "内置 12 条案件覆盖四种处置策略与五种状态，含 3 条未绑定规则模板的跨境案件用于验证提交拦截、2 条高风险待升级案件。"
      L2:
        - id: "P04-L2-001"
          zone: "案件统计条"
          description: "展示当前筛选下案件总数与待处置、处置中、平台受理、已结案、已驳回的分档数量；数据由案件表按状态聚合，随筛选条件实时刷新并与表格行数一致。"
        - id: "P04-L2-002"
          zone: "筛选搜索区"
          description: "提供关键词、处置策略、状态、责任角色、地区五组控件与重置按钮；条件作用于案件表字段组合匹配，跨境筛选会联动校验规则模板绑定情况。"
        - id: "P04-L2-003"
          zone: "案件数据表格区"
          description: "展示案件编号、关联线索、涉案专利、被诉卖家、处置策略、地区、绑定规则、状态与责任人；数据来源于案件表，行集由筛选与分页状态位全量重算。"
        - id: "P04-L2-004"
          zone: "处置操作区"
          description: "聚合新建案件、导出台账与批量提醒三类操作；新建与导出受角色权限控制，按钮可用性随勾选状态与角色动态变化。"
        - id: "P04-L2-005"
          zone: "分页控制区"
          description: "提供每页条数与翻页控件，与筛选状态位独立计算；翻页后计数文本与可见行数保持一致，避免状态污染导致的半吊子筛选。"
      L3:
        - id: "P04-L3-001"
          element: "新建案件按钮"
          function: "创建新的维权案件"
          trigger: "点击新建案件按钮"
          condition: "当前角色为品牌方IPR 或维权律师"
          response: "弹出立案弹窗，选择线索与处置策略后提交，生成案件编号并插入列表首行"
          state: "按钮常驻可点击"
          exception: "必填项缺失或命中重复卖家专利组合时阻断提交并提示原因"
        - id: "P04-L3-002"
          element: "处置策略下拉"
          function: "按处置策略过滤案件列表"
          trigger: "切换下拉选项"
          condition: "存在该策略案件"
          response: "列表按所选策略过滤并刷新统计条分档计数"
          state: "默认选项为全部策略"
          exception: "该策略无案件时列表为空态"
        - id: "P04-L3-003"
          element: "状态筛选下拉"
          function: "按案件状态过滤列表"
          trigger: "切换下拉选项"
          condition: "存在该状态案件"
          response: "列表按所选状态过滤并同步更新统计条与分页"
          state: "默认选项为全部状态"
          exception: "该状态无案件时列表为空态"
        - id: "P04-L3-004"
          element: "责任人筛选下拉"
          function: "按责任角色过滤案件列表"
          trigger: "切换下拉选项"
          condition: "存在该责任人案件"
          response: "列表按所选责任人过滤并刷新计数"
          state: "默认选项为全部责任人"
          exception: "该责任人无案件时列表为空态"
        - id: "P04-L3-005"
          element: "关键词搜索输入框"
          function: "按案件编号、专利号或卖家模糊搜索"
          trigger: "在输入框逐键输入"
          condition: "输入内容非空"
          response: "表格行集按关键词实时过滤，统计条计数同步更新"
          state: "输入框为空时展示全部案件"
          exception: "无匹配结果时显示空态提示"
        - id: "P04-L3-006"
          element: "行内推进状态按钮（同类首个，其余 11 个实例共用本说明）"
          function: "将当前案件状态按流转规则推进"
          trigger: "点击行内推进按钮"
          condition: "案件状态非已结案且跨境案件已绑定规则模板"
          response: "案件状态前进一格，状态列徽标与时间线同步更新"
          state: "已结案行按钮为禁用态"
          exception: "跨境案件未绑定规则模板时提示需先绑定后再推进"
        - id: "P04-L3-007"
          element: "行内查看证据链接（同类首个，其余 11 个实例共用本说明）"
          function: "查看该案件关联的存证取证详情"
          trigger: "点击行内查看证据链接"
          condition: "案件关联线索已存在存证记录"
          response: "切换至存证取证详情页并载入关联线索的存证信息"
          state: "链接常驻可点击"
          exception: "未存证时提示该案件暂无证据记录"
        - id: "P04-L3-008"
          element: "行内升级律师按钮（同类首个，其余 11 个实例共用本说明）"
          function: "将案件责任人升级为维权律师"
          trigger: "点击行内升级按钮"
          condition: "案件风险等级为高或处置策略为诉讼前置"
          response: "责任人列变更为维权律师并提示升级成功，案件置顶显示"
          state: "已由律师负责时按钮为禁用态"
          exception: "低风险案件点击时提示不满足升级条件"
        - id: "P04-L3-009"
          element: "导出案件台账按钮"
          function: "导出当前筛选结果为案件台账"
          trigger: "点击导出台账按钮"
          condition: "当前筛选结果非空"
          response: "按当前筛选条件导出 CSV 并提示导出条数"
          state: "结果为空时按钮禁用"
          exception: "导出内容为空时提示无可导出数据"
  - id: "P05"
    name: "cross-border-rules"
    type: "crud_list"
    entity: "CrossBorderRule"
    route: "/rules"
    priority: "P1"
    fields:
      - field: "ruleCode"
        in_search: true
        in_table: true
      - field: "region"
        in_search: true
        in_table: true
        in_form: true
      - field: "platform"
        in_search: true
        in_table: true
        in_form: true
      - field: "channel"
        in_table: true
        in_form: true
        in_detail: true
      - field: "responseSla"
        in_table: true
        in_form: true
        in_detail: true
      - field: "materials"
        in_form: true
        in_detail: true
      - field: "templateName"
        in_table: true
        in_form: true
      - field: "enabled"
        in_search: true
        in_table: true
      - field: "boundCases"
        in_table: true
        in_detail: true
      - field: "updatedAt"
        in_table: true
    operations:
      - name: "新建规则"
        type: "create"
        trigger: "点击新建规则按钮"
        condition: "当前角色为品牌方IPR 或维权律师"
        feedback: "弹出规则编辑弹窗，提交后规则进入启用状态"
      - name: "编辑规则"
        type: "update"
        trigger: "点击行内编辑按钮"
        condition: "规则存在且未被案件锁定"
        feedback: "弹出编辑弹窗，保存后更新时间戳"
      - name: "绑定案件"
        type: "custom"
        trigger: "点击行内绑定案件按钮"
        condition: "规则处于启用状态"
        feedback: "弹出案件选择弹窗，绑定后已绑定案件数加一"
      - name: "下载模板"
        type: "export"
        trigger: "点击行内下载模板链接"
        condition: "规则已配置模板名称"
        feedback: "下载规则模板文件并提示下载成功"
    annotations:
      L1:
        summary: "跨境规则库维护欧美与东南亚各国各平台的投诉规则模板，包含投诉渠道、响应时效与材料清单，跨境案件必须在此绑定对应规则模板后方可推进处置，是海外维权的合规前置。"
        entry: "左侧导航跨境规则；或由案件中心跨境案件提示缺少规则模板跳转进入。"
        precondition: "用户具备品牌方IPR 或维权律师角色；规则库已完成至少一条地区模板初始化。"
        data_entity: "CrossBorderRule、RightsCase"
        business_rules:
          - "跨境案件必须绑定对应国家地区的投诉规则模板，否则不可推进至处置中"
          - "规则停用后已绑定案件不受影响，但新案件不可再绑定该规则"
          - "响应时效以工作日计算，超期未受理的案件在案件中心标记超时提醒"
        test_data: "内置 12 条规则覆盖美欧英日东南亚韩国六个地区与六个平台，含 2 条停用态规则与 3 条尚未绑定任何案件的规则。"
      L2:
        - id: "P05-L2-001"
          zone: "地区平台筛选区"
          description: "提供地区下拉、平台下拉、启用状态下拉与关键词搜索四组控件；条件作用于规则表字段组合匹配，筛选后卡片区与统计同步刷新。"
        - id: "P05-L2-002"
          zone: "规则数据表格区"
          description: "以表格展示规则编号、地区、平台、投诉渠道、响应时效、模板名称、启用状态与已绑定案件数；数据来源于规则表，行集随筛选与分页状态位全量重算。"
        - id: "P05-L2-003"
          zone: "规则详情区"
          description: "展示当前选中规则的材料清单、投诉渠道说明与已绑定案件列表；数据由规则表与案件表关联查询，用于提交投诉前核对材料是否齐备。"
        - id: "P05-L2-004"
          zone: "绑定案件区"
          description: "展示规则与案件的绑定关系及绑定数量，提供绑定入口；绑定后案件中心该案件的规则校验通过，未绑定案件在案件中心被标记为待绑定。"
        - id: "P05-L2-005"
          zone: "操作按钮区"
          description: "聚合新建规则、导出规则库与操作说明入口；新建受角色权限控制，停用规则不出现在案件绑定候选中。"
      L3:
        - id: "P05-L3-001"
          element: "地区下拉筛选"
          function: "按国家地区过滤规则列表"
          trigger: "切换下拉选项"
          condition: "存在该地区规则"
          response: "列表仅显示所选地区规则并刷新统计与分页"
          state: "默认选项为全部地区"
          exception: "该地区无规则时列表为空态"
        - id: "P05-L3-002"
          element: "平台下拉筛选"
          function: "按适用平台过滤规则列表"
          trigger: "切换下拉选项"
          condition: "存在该平台规则"
          response: "列表按所选平台过滤并刷新计数"
          state: "默认选项为全部平台"
          exception: "该平台无规则时列表为空态"
        - id: "P05-L3-003"
          element: "规则关键词搜索框"
          function: "按规则编号或模板名称模糊搜索"
          trigger: "在输入框逐键输入"
          condition: "输入内容非空"
          response: "表格行集实时过滤并同步更新统计"
          state: "输入框为空时展示全部规则"
          exception: "无匹配结果时显示空态提示"
        - id: "P05-L3-004"
          element: "新建规则按钮"
          function: "创建新的跨境投诉规则模板"
          trigger: "点击新建规则按钮"
          condition: "当前角色为品牌方IPR 或维权律师"
          response: "弹出规则编辑弹窗，填写地区平台与材料清单后提交，规则以启用态插入列表"
          state: "按钮常驻可点击"
          exception: "必填项缺失时阻断提交并提示缺失字段"
        - id: "P05-L3-005"
          element: "行内编辑按钮（同类首个，其余 11 个实例共用本说明）"
          function: "编辑当前规则的渠道、时效与材料清单"
          trigger: "点击行内编辑按钮"
          condition: "规则存在且未被案件锁定"
          response: "弹出编辑弹窗，保存后更新时间戳并刷新该行"
          state: "停用态规则按钮仍可用"
          exception: "规则被已受理案件锁定时提示不可编辑"
        - id: "P05-L3-006"
          element: "行内绑定案件按钮（同类首个，其余 11 个实例共用本说明）"
          function: "将当前规则绑定到跨境案件"
          trigger: "点击行内绑定按钮"
          condition: "规则处于启用状态"
          response: "弹出案件选择弹窗，选定后已绑定案件数加一并提示绑定成功"
          state: "停用态规则按钮为禁用态"
          exception: "无可绑定跨境案件时提示暂无待绑定案件"
        - id: "P05-L3-007"
          element: "行内下载模板链接（同类首个，其余 11 个实例共用本说明）"
          function: "下载该规则的投诉材料模板"
          trigger: "点击行内下载模板链接"
          condition: "规则已配置模板名称"
          response: "生成模板文件下载并提示下载成功"
          state: "无模板名称时链接为禁用态"
          exception: "模板文件缺失时提示模板待补充"
        - id: "P05-L3-008"
          element: "规则启用开关"
          function: "切换规则的启用与停用状态"
          trigger: "点击开关"
          condition: "规则未处于锁定编辑中"
          response: "启用状态列切换并同步过滤案件绑定候选项"
          state: "开关显示当前启用状态"
          exception: "存在进行中绑定操作时提示先完成绑定"
  - id: "P06"
    name: "rights-analytics"
    type: "dashboard"
    entity: "RightsCase"
    route: "/analytics"
    priority: "P1"
    fields:
      - field: "caseNo"
        in_table: true
      - field: "patentNo"
        in_table: true
      - field: "strategy"
        in_table: true
      - field: "region"
        in_table: true
      - field: "status"
        in_table: true
      - field: "outcome"
        in_table: true
      - field: "compensation"
        in_table: true
      - field: "createdAt"
        in_table: true
      - field: "closedAt"
        in_table: true
    operations:
      - name: "时间范围筛选"
        type: "read"
        trigger: "切换时间范围下拉"
        condition: "存在该时间范围内的结案案件"
        feedback: "全部指标与分布按所选范围重算"
      - name: "导出统计报表"
        type: "export"
        trigger: "点击导出报表按钮"
        condition: "当前统计结果非空"
        feedback: "导出统计报表为 CSV 并提示导出条数"
      - name: "查看专利案件"
        type: "read"
        trigger: "点击排行行查看链接"
        condition: "该专利存在关联案件"
        feedback: "跳转案件中心并按该专利号筛选"
    annotations:
      L1:
        summary: "维权效果统计以案件数据为基础输出下架率、结案率、平均处置周期与维权收益四项核心指标，并按渠道、地区与专利维度拆解分布，供品牌方IPR 向管理层汇报维权投入产出。"
        entry: "左侧导航维权统计；或由工作台指标卡、案件中心结案后跳转进入。"
        precondition: "系统内已存在至少一条已结案案件；用户具备任一角色均可查看。"
        data_entity: "RightsCase、InfringementLead、CrossBorderRule"
        business_rules:
          - "下架率等于处置结果为已下架的结案案件数除以结案案件总数"
          - "平均处置周期取立案时间与结案时间差值均值，未结案案件不计入"
          - "维权收益仅统计已结案且已回款的案件金额"
        test_data: "内置 12 条结案案件覆盖近三个月、六个地区与四种处置策略，含 2 条超期未结案案件用于验证周期统计边界。"
      L2:
        - id: "P06-L2-001"
          zone: "效果指标卡区"
          description: "以四张可点击指标卡展示下架率、结案率、平均处置周期与累计维权收益；数据由案件表按结案状态与处置结果聚合计算，随顶部时间范围筛选联动重算。"
        - id: "P06-L2-002"
          zone: "渠道分布统计区"
          description: "展示各侵权渠道的结案数与下架数对比，数据来源于线索渠道字段与案件处置结果关联聚合，用于识别需要加大监测力度的渠道。"
        - id: "P06-L2-003"
          zone: "地区分布统计区"
          description: "展示境内与跨境各地区的案件量与平均周期，数据由案件地区字段分组聚合，跨境地区按规则模板响应时效对比实际周期以评估合规成本。"
        - id: "P06-L2-004"
          zone: "专利维权排行区"
          description: "按维权收益与案件数对涉案专利排序，展示专利号、案件数、下架率与收益；数据来源于案件表按专利号分组，点击可跳转案件中心查看明细。"
        - id: "P06-L2-005"
          zone: "时间范围筛选区"
          description: "提供近七日、近三十日、本季度与全部四个时间范围选项与渠道类型下拉；选项变更后全部指标与分布区块同步重算并更新分区标题。"
      L3:
        - id: "P06-L3-001"
          element: "指标卡-下架率"
          function: "展示结案案件中的侵权商品下架比例"
          trigger: "点击指标卡"
          condition: "存在已结案案件"
          response: "高亮渠道分布区块并展示下架明细说明"
          state: "无结案案件时显示占位符"
          exception: "结案数为 0 时提示暂无统计数据"
        - id: "P06-L3-002"
          element: "指标卡-结案率"
          function: "展示已结案案件占全部案件的比例"
          trigger: "点击指标卡"
          condition: "存在案件数据"
          response: "跳转案件中心并按已结案状态筛选"
          state: "数值随案件状态变化刷新"
          exception: "无案件时显示 0 且不跳转"
        - id: "P06-L3-003"
          element: "指标卡-平均处置周期"
          function: "展示立案到结案的平均天数"
          trigger: "点击指标卡"
          condition: "存在已结案案件"
          response: "高亮地区分布区块的周期对比"
          state: "未结案案件不计入统计"
          exception: "无结案案件时显示占位符并禁用点击"
        - id: "P06-L3-004"
          element: "指标卡-维权收益"
          function: "展示已结案且已回款案件的累计收益金额"
          trigger: "点击指标卡"
          condition: "存在已回款案件"
          response: "跳转专利维权排行并按收益排序"
          state: "金额以万元为单位展示"
          exception: "无回款案件时显示 0 且不跳转"
        - id: "P06-L3-005"
          element: "时间范围下拉"
          function: "切换统计的时间范围"
          trigger: "切换下拉选项"
          condition: "所选范围内存在案件数据"
          response: "四项指标与三个分布区块按所选范围重算并更新标题"
          state: "默认选项为近三十日"
          exception: "所选范围无数据时各区块显示空态"
        - id: "P06-L3-006"
          element: "渠道类型下拉"
          function: "按侵权渠道过滤统计分布"
          trigger: "切换下拉选项"
          condition: "存在该渠道案件"
          response: "分布区块与指标按所选渠道重算"
          state: "默认选项为全部渠道"
          exception: "该渠道无案件时分布区块为空态"
        - id: "P06-L3-007"
          element: "导出统计报表按钮"
          function: "导出当前统计结果为报表文件"
          trigger: "点击导出报表按钮"
          condition: "当前统计结果非空"
          response: "按当前时间范围与渠道导出 CSV 并提示导出条数"
          state: "结果为空时按钮禁用"
          exception: "无可导出数据时提示暂无统计结果"
        - id: "P06-L3-008"
          element: "排行行查看专利案件链接（同类首个，其余 9 个实例共用本说明）"
          function: "查看该专利关联的全部维权案件"
          trigger: "点击排行行查看链接"
          condition: "该专利存在关联案件"
          response: "跳转维权案件中心并按该专利号自动筛选"
          state: "链接常驻可点击"
          exception: "该专利无关联案件时提示暂无案件"
