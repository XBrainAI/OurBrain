# 需求模型（Phase 1 由 AI 与 PM 对话填充，Phase 2 锁定后只读）
# 注：本文件使用纯块级 YAML 语法（轻量解析器不支持行内 flow 映射）
project:
  name: "专利资产全生命周期数字化价值运营管理平台"
  description: "将专利从授权登记、年费监控、AI 四维估值、组合战略、产业撮合到质押/转让退出的全过程纳入统一数字底稿，让专利资产可量化、可预警、可交易、可尽调。"
  domain: "IPAM"
  slug: "patent-asset"
  name_en: "Patent Asset Lifecycle Value Platform"

entities:
  - name: PatentAsset
    displayName: "专利资产"
    fields:
      - name: patentNo
        displayName: "专利号"
        type: string
        required: true
      - name: title
        displayName: "专利名称"
        type: string
        required: true
      - name: patentType
        displayName: "专利类型"
        type: enum
        required: true
        options:
          - "发明专利"
          - "实用新型"
          - "外观设计"
      - name: techField
        displayName: "技术领域"
        type: enum
        required: true
        options:
          - "人工智能"
          - "新能源"
          - "生物医药"
          - "高端制造"
          - "新材料"
          - "数字通信"
      - name: owner
        displayName: "专利权人"
        type: string
        required: true
      - name: applyDate
        displayName: "申请日"
        type: date
      - name: grantDate
        displayName: "授权日"
        type: date
      - name: expiryDate
        displayName: "届满日"
        type: date
      - name: feeDueDate
        displayName: "年费截止日"
        type: date
      - name: annualFee
        displayName: "年费金额(元)"
        type: number
      - name: value
        displayName: "当前估值(万元)"
        type: number
      - name: valueGrade
        displayName: "估值等级"
        type: enum
        options:
          - "A级"
          - "B级"
          - "C级"
          - "D级"
      - name: status
        displayName: "资产状态"
        type: enum
        required: true
        options:
          - "有效"
          - "年费预警"
          - "失效"
      - name: pledgeStatus
        displayName: "质押状态"
        type: enum
        options:
          - "未质押"
          - "质押中"
    statuses:
      - value: ACTIVE
        label: "有效"
        color: success
      - value: FEE_WARNING
        label: "年费预警"
        color: warning
      - value: EXPIRED
        label: "失效"
        color: danger
    transitions:
      - from: ACTIVE
        to: FEE_WARNING
        trigger: "年费到期前30天自动预警"
        condition: "系统自动检测 feeDueDate 距今 30 天内"
      - from: FEE_WARNING
        to: ACTIVE
        trigger: "缴纳年费"
        condition: "年费到账登记"
      - from: FEE_WARNING
        to: EXPIRED
        trigger: "逾期未缴自动失效"
        condition: "超过年费截止日仍未缴纳"
      - from: EXPIRED
        to: ACTIVE
        trigger: "补缴年费并恢复"
        condition: "资产经理审批通过"

  - name: ValuationRecord
    displayName: "估值记录"
    fields:
      - name: recordNo
        displayName: "估值编号"
        type: string
        required: true
      - name: patentNo
        displayName: "专利号"
        type: string
        required: true
      - name: quarter
        displayName: "估值期"
        type: enum
        required: true
        options:
          - "2025-Q4"
          - "2026-Q1"
          - "2026-Q2"
          - "2026-Q3"
      - name: legalScore
        displayName: "法律维度"
        type: number
      - name: techScore
        displayName: "技术维度"
        type: number
      - name: marketScore
        displayName: "市场维度"
        type: number
      - name: revenueScore
        displayName: "营收维度"
        type: number
      - name: totalScore
        displayName: "综合得分"
        type: number
      - name: value
        displayName: "估值(万元)"
        type: number
      - name: status
        displayName: "确认状态"
        type: enum
        required: true
        options:
          - "待确认"
          - "已确认"
      - name: confirmedBy
        displayName: "确认人"
        type: string
      - name: confirmedAt
        displayName: "确认时间"
        type: date
    statuses:
      - value: PENDING
        label: "待确认"
        color: warning
      - value: CONFIRMED
        label: "已确认"
        color: success
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "资产经理确认估值"
        condition: "每季度估值需确认后生效"

  - name: AnnualFeeRecord
    displayName: "年费记录"
    fields:
      - name: patentNo
        displayName: "专利号"
        type: string
        required: true
      - name: year
        displayName: "年度"
        type: number
        required: true
      - name: dueDate
        displayName: "缴费截止日"
        type: date
        required: true
      - name: amount
        displayName: "金额(元)"
        type: number
        required: true
      - name: status
        displayName: "缴费状态"
        type: enum
        required: true
        options:
          - "已缴"
          - "待缴"
          - "预警"
          - "逾期"
      - name: paidAt
        displayName: "缴费日期"
        type: date
    statuses:
      - value: PAID
        label: "已缴"
        color: success
      - value: PENDING
        label: "待缴"
        color: info
      - value: WARNING
        label: "预警"
        color: warning
      - value: OVERDUE
        label: "逾期"
        color: danger

  - name: PledgeTransferRecord
    displayName: "质押转让记录"
    fields:
      - name: recordNo
        displayName: "业务编号"
        type: string
        required: true
      - name: patentNo
        displayName: "专利号"
        type: string
        required: true
      - name: type
        displayName: "业务类型"
        type: enum
        required: true
        options:
          - "质押登记"
          - "专利转让"
      - name: counterparty
        displayName: "对手方"
        type: string
        required: true
      - name: amount
        displayName: "金额/对价(万元)"
        type: number
      - name: startDate
        displayName: "起始日"
        type: date
      - name: status
        displayName: "状态"
        type: enum
        required: true
        options:
          - "审批中"
          - "生效中"
          - "已解除"
          - "已完成"
          - "已驳回"
    statuses:
      - value: IN_REVIEW
        label: "审批中"
        color: info
      - value: ACTIVE
        label: "生效中"
        color: primary
      - value: RELEASED
        label: "已解除"
        color: success
      - value: COMPLETED
        label: "已完成"
        color: success
      - value: REJECTED
        label: "已驳回"
        color: danger
    transitions:
      - from: IN_REVIEW
        to: ACTIVE
        trigger: "审批通过生效"
        condition: "质押登记/转让审批"
      - from: ACTIVE
        to: RELEASED
        trigger: "解除质押"
        condition: "仅质押登记且生效中"
      - from: ACTIVE
        to: COMPLETED
        trigger: "转让交割完成"
        condition: "仅专利转让且生效中"

  - name: MatchDeal
    displayName: "撮合意向"
    fields:
      - name: dealNo
        displayName: "意向编号"
        type: string
        required: true
      - name: patentNo
        displayName: "关联专利号"
        type: string
        required: true
      - name: buyer
        displayName: "需求方"
        type: string
        required: true
      - name: industry
        displayName: "需求行业"
        type: enum
        options:
          - "人工智能"
          - "新能源"
          - "生物医药"
          - "高端制造"
          - "新材料"
          - "数字通信"
      - name: intentType
        displayName: "意向类型"
        type: enum
        required: true
        options:
          - "转让"
          - "许可"
          - "质押融资"
      - name: budget
        displayName: "预算(万元)"
        type: number
      - name: status
        displayName: "意向状态"
        type: enum
        required: true
        options:
          - "初步接触"
          - "尽调中"
          - "签署意向"
          - "成交"
          - "搁置"
      - name: owner
        displayName: "负责人"
        type: string
    statuses:
      - value: CONTACT
        label: "初步接触"
        color: info
      - value: DUE_DILIGENCE
        label: "尽调中"
        color: primary
      - value: SIGNED
        label: "签署意向"
        color: warning
      - value: DEAL
        label: "成交"
        color: success
      - value: PAUSED
        label: "搁置"
        color: danger
    transitions:
      - from: CONTACT
        to: DUE_DILIGENCE
        trigger: "推进尽调"
        condition: "顺序推进"
      - from: DUE_DILIGENCE
        to: SIGNED
        trigger: "签署意向书"
        condition: "顺序推进"
      - from: SIGNED
        to: DEAL
        trigger: "确认成交"
        condition: "顺序推进"
      - from: SIGNED
        to: PAUSED
        trigger: "搁置"
        condition: "终态"

pages:
  - id: P01
    name: executive-dashboard
    type: dashboard
    entity: PatentAsset
    route: /dashboard
    priority: P0
    operations:
      - name: "查看在管资产"
        type: read
        trigger: "点击「在管资产」指标卡"
        condition: "高管（C级）角色"
        feedback: "路由跳转至专利资产台账"
      - name: "查看风险预警明细"
        type: read
        trigger: "点击预警行「查看」"
        condition: "存在年费预警/失效资产"
        feedback: "路由跳转至质押转让跟踪并定位记录"
      - name: "查看年度成交"
        type: read
        trigger: "点击「年度成交额」指标卡"
        condition: "存在撮合成交记录"
        feedback: "路由跳转至产业撮合通道"
    annotations:
      L1:
        summary: "高管驾驶舱汇总全平台专利资产规模、估值分布与风险预警，一屏掌握资产运营全景，仅对 C 级角色开放。"
        entry: "侧边导航「高管驾驶舱」（C 级角色专属，默认首页）"
        precondition: "以高管（C级）角色登录"
        data_entity: "PatentAsset / ValuationRecord / MatchDeal / AnnualFeeRecord 汇总"
        business_rules:
          - "驾驶舱仅对 C 级角色开放，其他角色导航中不可见"
          - "估值数据取各专利最新已确认季度估值"
          - "风险预警列表仅展示年费预警与失效资产"
        test_data: "12 条专利资产、14 条估值记录、12 条撮合意向汇总"
      L2:
        - id: P01-L2-001
          zone: "指标概览区"
          description: "四张核心指标卡（在管资产/总估值/风险资产/年度成交额），数据来源于全量专利资产、最新已确认估值与撮合记录的实时汇总，点击卡片可跳转对应业务页面。"
        - id: P01-L2-002
          zone: "估值分布区"
          description: "技术领域估值分布与估值等级结构，数据来源各专利最新已确认估值记录，按技术领域聚合求和、按等级计数。"
        - id: P01-L2-003
          zone: "风险预警区"
          description: "年费预警与失效资产列表，数据来源年费记录与台账状态，按风险等级排序，点击可跳转处理。"
      L3:
        - id: P01-L3-001
          element: "指标卡·在管资产"
          function: "总览在管专利资产数量并跳转台账"
          trigger: "单击指标卡"
          condition: "始终可用"
          response: "路由至专利资产台账并展示全部资产"
          state: "正常"
          exception: "无"
        - id: P01-L3-002
          element: "指标卡·总估值"
          function: "总览资产总估值并跳转估值中心"
          trigger: "单击指标卡"
          condition: "始终可用"
          response: "路由至估值中心查看已确认估值"
          state: "正常"
          exception: "无"
        - id: P01-L3-003
          element: "指标卡·风险资产"
          function: "总览年费预警与失效资产数并跳转风险处理"
          trigger: "单击指标卡"
          condition: "存在风险资产"
          response: "路由至质押转让跟踪查看风险记录"
          state: "正常"
          exception: "无风险资产时计数为 0 且仍可跳转"
        - id: P01-L3-004
          element: "指标卡·年度成交额"
          function: "总览本年度撮合成交总额并跳转撮合通道"
          trigger: "单击指标卡"
          condition: "始终可用"
          response: "路由至产业撮合通道"
          state: "正常"
          exception: "无"
        - id: P01-L3-005
          element: "预警行查看按钮（同类首个，其余 4 个实例共用本说明）"
          function: "定位处理该风险专利"
          trigger: "单击预警行「查看」"
          condition: "预警列表非空"
          response: "路由至专利资产台账并按该专利过滤定位"
          state: "正常"
          exception: "记录已删除时提示不存在"

  - id: P02
    name: patent-ledger
    type: crud_list
    entity: PatentAsset
    route: /patents
    priority: P0
    operations:
      - name: "新建专利资产"
        type: create
        trigger: "点击「新建专利」按钮并在弹窗提交"
        condition: "专利号唯一且必填项完整"
        feedback: "台账新增一行并刷新统计"
      - name: "查看详情"
        type: read
        trigger: "点击行「详情」按钮"
        condition: "行存在"
        feedback: "打开详情弹窗展示全部字段"
      - name: "缴纳年费"
        type: update
        trigger: "点击行「缴费」按钮并确认"
        condition: "资产状态为年费预警或待缴"
        feedback: "年费记录置为已缴、资产状态回到有效"
      - name: "组合筛选"
        type: read
        trigger: "输入关键字/切换状态/切换技术领域"
        condition: "无"
        feedback: "表格行与统计条按组合条件全量重算"
    annotations:
      L1:
        summary: "全流程专利资产台账：登记与维护专利资产，监控年费缴纳（到期前 30 天预警、逾期失效），支持关键字/状态/技术领域组合筛选。"
        entry: "侧边导航「专利资产台账」"
        precondition: "企业IPR / 资产经理 / 银行风控 / 高管均可进入（权限随角色差异）"
        data_entity: "PatentAsset / AnnualFeeRecord"
        business_rules:
          - "年费到期前 30 天自动预警"
          - "逾期未缴自动置为失效"
          - "筛选条件组合叠加，统计条与表格行同步重算"
        test_data: "12 条专利资产记录，覆盖有效/年费预警/失效/质押中"
      L2:
        - id: P02-L2-001
          zone: "筛选搜索区"
          description: "关键字/资产状态/技术领域组合筛选，数据来源台账全量记录，按组合条件全量重算表格行并同步统计条计数。"
        - id: P02-L2-002
          zone: "统计概览条"
          description: "在管总数、年费预警、逾期失效、质押中四项实时计数，数据来源当前筛选结果集合，随筛选条件变化实时重算。"
        - id: P02-L2-003
          zone: "资产列表区"
          description: "专利资产表格，展示专利号、名称、类型、领域、权利人、年费截止日、估值与状态，操作列提供详情查看与年费缴纳，数据来源 PatentAsset 实体。"
      L3:
        - id: P02-L3-001
          element: "关键字搜索框"
          function: "按专利号/名称/权利人模糊过滤台账"
          trigger: "键入文本（逐键）"
          condition: "无"
          response: "表格行与统计条实时重算"
          state: "正常"
          exception: "无匹配时展示空态提示"
        - id: P02-L3-002
          element: "资产状态下拉"
          function: "按资产状态过滤（有效/年费预警/失效）"
          trigger: "选择选项"
          condition: "无"
          response: "表格行与统计条实时重算"
          state: "正常"
          exception: "无"
        - id: P02-L3-003
          element: "技术领域下拉"
          function: "按技术领域过滤"
          trigger: "选择选项"
          condition: "无"
          response: "表格行与统计条实时重算"
          state: "正常"
          exception: "无"
        - id: P02-L3-004
          element: "新建专利按钮"
          function: "打开新建专利弹窗登记资产"
          trigger: "单击按钮"
          condition: "企业IPR 角色"
          response: "弹窗展示可提交，提交后台账新增一行"
          state: "正常"
          exception: "专利号重复时提交阻断并提示"
        - id: P02-L3-005
          element: "行详情按钮（同类首个，其余 11 个实例共用本说明）"
          function: "查看该专利资产完整档案"
          trigger: "单击行内「详情」"
          condition: "行存在"
          response: "打开详情弹窗展示全部字段与年费记录"
          state: "正常"
          exception: "无"
        - id: P02-L3-006
          element: "行缴费按钮（同类首个，其余 11 个实例共用本说明）"
          function: "为该专利缴纳年费"
          trigger: "单击行内「缴费」并确认"
          condition: "资产状态为年费预警"
          response: "年费记录置为已缴、资产状态回到有效、预警计数减一"
          state: "正常"
          exception: "无待缴年费预警时确认缴纳被阻断并提示，缴费弹窗仍可正常开关"
        - id: P02-L3-007
          element: "重置筛选按钮"
          function: "清空筛选条件并恢复全量台账"
          trigger: "单击「重置」"
          condition: "无"
          response: "清空搜索框与下拉并重算表格与统计"
          state: "正常"
          exception: "无"

  - id: P03
    name: valuation-center
    type: crud_list
    entity: ValuationRecord
    route: /valuations
    priority: P0
    operations:
      - name: "发起季度估值"
        type: create
        trigger: "点击「发起季度估值」按钮"
        condition: "当前季度无待确认估值"
        feedback: "为在管专利生成新一期待确认估值记录"
      - name: "确认估值"
        type: update
        trigger: "点击行「确认」按钮"
        condition: "资产经理角色且记录待确认"
        feedback: "记录状态置为已确认并同步台账估值"
      - name: "查看四维模型"
        type: read
        trigger: "点击行「模型」按钮"
        condition: "记录存在"
        feedback: "打开弹窗展示法律/技术/市场/营收四维得分"
    annotations:
      L1:
        summary: "行业定制 AI 估值中心：法律/技术/市场/营收四维打分，每季度生成一版估值，资产经理确认后生效并同步台账与驾驶舱。"
        entry: "侧边导航「估值中心」"
        precondition: "确认操作仅资产经理可执行，其余角色可查看"
        data_entity: "ValuationRecord / PatentAsset"
        business_rules:
          - "估值每季度更新一次，需经资产经理确认"
          - "待确认估值不参与台账与驾驶舱展示"
