<script src="../../../../assets/echarts.min.js"></script>
<style>
  :root {

    --level-mid: #faad14;      /* 中 = 黄 */

    margin: 0;

  .repo-name { font-weight: 600; font-size: 15px; margin-right: 8px; }
  .repo-total { font-size: 30px; font-weight: 700; line-height: 1.2; margin: 4px 0 2px; }

  .badge {
    display: inline-block;
    padding: 1px 10px;
    border-radius: 10px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    vertical-align: middle;
  }
  .chart { width: 100%; }
  .chart-radar { height: 420px; }
  .chart-line { height: 360px; }
  .chart-bar { height: 360px; }
  .empty { color: #909399; padding: 24px 0; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #ebeef5; padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #f5f7fa; font-weight: 600; white-space: nowrap; }
  tbody tr:nth-child(even) { background: #fafafa; }

  .chip {
    border: 1px solid #dcdfe6;
    border-radius: 6px;
    padding: 4px 10px;
    background: #fafafa;
    white-space: nowrap;
  }
  .chip.ok { border-color: var(--level-low); color: var(--level-low); background: #f0f9eb; }
  .chip.alert { border-color: var(--level-severe); color: var(--level-severe); background: #fef0f0; font-weight: 600; }
  .q-title { font-weight: 600; margin-bottom: 8px; }
  .quality-group { margin-bottom: 16px; }
  .quality-group:last-child { margin-bottom: 0; }
  .insight-group { margin-bottom: 12px; }
  .insight-group:last-child { margin-bottom: 0; }
  .insight-group ul { margin: 4px 0; padding-left: 20px; }
  .report-footer { color: #909399; font-size: 12px; text-align: center; line-height: 1.8; }
  .cdn-note { color: #e6a23c; }
</style>

<script>
/* ============================================================
 * 渲染区 —— 严禁改动：以下逻辑全部由 REPORT_DATA 驱动，不得硬编码数据
 * ============================================================ */
(function () {
  'use strict';
  var DATA = window.REPORT_DATA || { meta: {}, repos: [], history: [] };
  var PALETTE = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de', '#3ba272'];
  var LEVEL_COLOR = { '低': '#52c41a', '中': '#faad14', '高': '#fa8c16', '严重': '#f5222d' };
  var LEVEL_ORDER = { '严重': 0, '高': 1, '中': 2, '低': 3 };
  var charts = [];

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function levelColor(level) { return LEVEL_COLOR[level] || '#909399'; }
  function emptyBox(text) { return '<div class="empty">' + esc(text) + '</div>'; }
  function chartUnavailable() { return emptyBox('ECharts 未加载，图表不可用（其余模块不受影响）'); }

  /* 模块 1：header meta 行 */
  (function () {
    var m = DATA.meta || {};
    var parts = [];
    if (m.period != null) parts.push('第 ' + m.period + ' 期');
    if (m.date) parts.push(m.date);
    if (m.window) parts.push('窗口期 ' + m.window);
    if (m.repoCount != null) parts.push('仓库数 ' + m.repoCount);
    el('metaLine').textContent = parts.join(' · ');
  })();

  /* 模块 2：风险总览卡片 */
  (function () {
    var box = el('overviewGrid');
    var repos = DATA.repos || [];
    if (!repos.length) { box.innerHTML = emptyBox('无仓库数据'); return; }
    box.innerHTML = repos.map(function (r) {
      return '<div class="repo-card">'
        + '<div><span class="repo-name">' + esc(r.name) + '</span>'
        + '<span class="badge" style="background:' + levelColor(r.level) + '">' + esc(r.level) + '</span></div>'
        + '<div class="repo-total" style="color:' + levelColor(r.level) + '">' + esc(r.total) + '</div>'
        + '<div class="repo-top">' + esc(r.topRisk || '—') + '</div>'
        + '<a href="' + esc(r.name) + '/report.md">查看详情</a>'
        + '</div>';
    }).join('');
  })();

  /* 模块 3：五维雷达图 */
  (function () {
    var box = el('chartRadar');
    var repos = DATA.repos || [];
    if (!repos.length) { box.innerHTML = emptyBox('无仓库数据'); return; }
    if (window.echarts) {
      var chart = echarts.init(box);
      chart.setOption({
        color: PALETTE,
        tooltip: {},
        legend: { bottom: 0, type: 'scroll' },
        radar: {
          indicator: [
            { name: '进度', max: 100 },
            { name: '人员', max: 100 },
            { name: '质量', max: 100 },
            { name: '集成', max: 100 },
            { name: '规范', max: 100 }
          ],
          radius: '62%'
        },
        series: [{
          type: 'radar',
          symbolSize: 4,
          data: repos.map(function (r) {
            var s = r.scores || {};
            return {
              name: r.name,
              value: [s.progress, s.people, s.quality, s.integration, s.convention]
            };
          })
        }]
      });
      charts.push(chart);
    } else {
      box.innerHTML = chartUnavailable();
    }
  })();

  /* 模块 4：跨期趋势折线图 */
  (function () {
    var box = el('chartTrend');
    var history = DATA.history || [];
    var repos = DATA.repos || [];
    if (!history.length || !repos.length) { box.innerHTML = emptyBox('无历史数据'); return; }
    var labels = history.map(function (h) { return h.label; });
    if (window.echarts) {
      var chart = echarts.init(box);
      chart.setOption({
        tooltip: { trigger: 'axis' },
        legend: { bottom: 0, type: 'scroll' },
        grid: { left: 16, right: 24, top: 24, bottom: 56, containLabel: true },
        xAxis: { type: 'category', boundaryGap: false, data: labels },
        yAxis: { type: 'value', min: 0, max: 100 },
        series: repos.map(function (r) {
          var values = history.map(function (h) {
            var rec = h.repos && h.repos[r.name];
            return rec ? rec.total : null;
          });
          var lastIndex = -1;
          for (var i = values.length - 1; i >= 0; i--) {
            if (values[i] != null) { lastIndex = i; break; }
          }
          return {
            name: r.name,
            type: 'line',
            connectNulls: true,
            itemStyle: { color: levelColor(r.level) },
            lineStyle: { color: levelColor(r.level), width: 2 },
            data: values,
            markPoint: lastIndex > -1 ? {
              symbolSize: 42,
              label: { show: false },
              data: [{ coord: [labels[lastIndex], values[lastIndex]] }]
            } : undefined
          };
        })
      });
      charts.push(chart);
    } else {
      box.innerHTML = chartUnavailable();
    }
  })();

  /* 模块 5：成员进度条形图 */
  (function () {
    var box = el('chartMember');
    var repos = DATA.repos || [];
    var memberNames = [];
    var lookup = {};
    repos.forEach(function (r) {
      lookup[r.name] = {};
      (r.members || []).forEach(function (m) {
        if (memberNames.indexOf(m.name) < 0) memberNames.push(m.name);
        lookup[r.name][m.name] = m;
      });
    });
    if (!memberNames.length) { box.innerHTML = emptyBox('无成员提交数据'); return; }
    if (window.echarts) {
      var chart = echarts.init(box);
      chart.setOption({
        color: PALETTE,
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'shadow' },
          formatter: function (params) {
            var out = [esc(params[0].name)];
            params.forEach(function (p) {
              var m = lookup[p.seriesName] && lookup[p.seriesName][p.name];
              if (m && m.commits > 0) {
                out.push(p.marker + ' ' + esc(p.seriesName) + '：' + m.commits + ' 次提交（+' + m.insertions + ' / -' + m.deletions + ' 行）');
              }
            });
            return out.join('<br>');
          }
        },
        legend: { bottom: 0, type: 'scroll' },
        grid: { left: 16, right: 24, top: 24, bottom: 56, containLabel: true },
        xAxis: { type: 'category', data: memberNames },
        yAxis: { type: 'value', name: '提交数', minInterval: 1 },
        series: repos.map(function (r) {
          return {
            name: r.name,
            type: 'bar',
            data: memberNames.map(function (n) {
              var m = lookup[r.name][n];
              return m ? m.commits : 0;
            })
          };
        })
      });
      charts.push(chart);
    } else {
      box.innerHTML = chartUnavailable();
    }
  })();

  /* 模块 6：分支健康对比（diverging bar） */
  (function () {
    var box = el('chartBranch');
    var repos = DATA.repos || [];
    var rowKeys = [];
    var branchMap = {};
    repos.forEach(function (r) {
      (r.branches || []).forEach(function (b) {
        var key = r.name + '/' + b.name;
        branchMap[key] = b;
        rowKeys.push(key);
      });
    });
    if (!rowKeys.length) { box.innerHTML = emptyBox('无分支数据'); return; }
    box.style.height = Math.max(240, rowKeys.length * 40) + 'px';
    if (window.echarts) {
      var chart = echarts.init(box);
      chart.setOption({
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'shadow' },
          formatter: function (params) {
            var key = params[0].name;
            var b = branchMap[key] || {};
            var ahead = 0;
            var behind = 0;
            params.forEach(function (p) {
              if (p.seriesName === '领先主干') ahead = p.value || 0;
              if (p.seriesName === '落后主干') behind = Math.abs(p.value || 0);
            });
            return esc(key) + '<br>领先 +' + ahead + ' / 落后 -' + behind
              + '<br>存活 ' + (b.staleDays != null ? b.staleDays + ' 天' : '—')
              + ' · 最后活跃 ' + (b.lastActive || '—');
          }
        },
        legend: { bottom: 0 },
        grid: { left: 16, right: 24, top: 24, bottom: 56, containLabel: true },
        xAxis: {
          type: 'value',
          axisLabel: { formatter: function (v) { return Math.abs(v); } }
        },
        yAxis: { type: 'category', data: rowKeys },
        series: [
          {
            name: '领先主干',
            type: 'bar',
            stack: 'branch',
            barWidth: 14,
            itemStyle: { color: '#5470c6' },
            data: rowKeys.map(function (k) { return branchMap[k].ahead || 0; })
          },
          {
            name: '落后主干',
            type: 'bar',
            stack: 'branch',
            barWidth: 14,
            itemStyle: { color: '#ee6666' },
            data: rowKeys.map(function (k) { return -(branchMap[k].behind || 0); })
          }
        ]
      });
      charts.push(chart);
    } else {
      box.innerHTML = chartUnavailable();
    }
  })();

  /* 模块 7：质量信号卡片 */
  (function () {
    var box = el('qualityCards');
    var repos = DATA.repos || [];
    if (!repos.length) { box.innerHTML = emptyBox('无仓库数据'); return; }
    box.innerHTML = repos.map(function (r) {
      var q = r.quality || {};
      var todoOver = q.todo != null && q.todoThreshold != null && q.todo > q.todoThreshold;
      var reworkOver = q.reworkRatio != null && q.reworkThreshold != null && q.reworkRatio > q.reworkThreshold;
      var bigOver = (q.bigCommits || 0) > 0;
      var largeOver = (q.largeFiles || 0) > 0;
      return '<div class="quality-group">'
        + '<div class="q-title">' + esc(r.name) + '</div>'
        + '<div class="chips">'
        + '<span class="chip ' + (todoOver ? 'alert' : 'ok') + '">TODO/FIXME：' + esc(q.todo) + ' / 阈值 ' + esc(q.todoThreshold) + '</span>'
        + '<span class="chip' + (bigOver ? ' alert' : '') + '">大提交：' + esc(q.bigCommits) + ' 个</span>'
        + '<span class="chip ' + (reworkOver ? 'alert' : 'ok') + '">返工比：' + esc(q.reworkRatio) + ' / 阈值 ' + esc(q.reworkThreshold) + '</span>'
        + '<span class="chip' + (largeOver ? ' alert' : '') + '">超大文件：' + esc(q.largeFiles) + ' 个</span>'
        + '</div></div>';
    }).join('');
  })();

  /* 模块 8：风险点清单表 */
  (function () {
    var box = el('riskTableWrap');
    var all = [];
    (DATA.repos || []).forEach(function (r) {
      (r.risks || []).forEach(function (k) { all.push({ repo: r.name, risk: k }); });
    });
    if (!all.length) { box.innerHTML = emptyBox('无风险点'); return; }
    all.sort(function (a, b) {
      var la = LEVEL_ORDER[a.risk.level] != null ? LEVEL_ORDER[a.risk.level] : 9;
      var lb = LEVEL_ORDER[b.risk.level] != null ? LEVEL_ORDER[b.risk.level] : 9;
      return la - lb;
    });
    var rows = all.map(function (item) {
      var k = item.risk;
      return '<tr>'
        + '<td title="' + esc(k.evidence || '') + '">' + esc(k.title) + '</td>'
        + '<td>' + esc(item.repo) + '</td>'
        + '<td>' + esc(k.dimension) + '</td>'
        + '<td><span class="badge" style="background:' + levelColor(k.level) + '">' + esc(k.level) + '</span></td>'
        + '<td>' + esc(k.advice || '') + '</td>'
        + '</tr>';
    }).join('');
    box.innerHTML = '<table><thead><tr><th>风险点</th><th>仓库</th><th>维度</th><th>等级</th><th>建议</th></tr></thead><tbody>' + rows + '</tbody></table>';
  })();

  /* 模块 9：里程碑状态表 */
  (function () {
    var box = el('milestoneTableWrap');
    var all = [];
    (DATA.repos || []).forEach(function (r) {
      (r.milestones || []).forEach(function (ms) { all.push({ repo: r.name, ms: ms }); });
    });
    if (!all.length) { box.innerHTML = emptyBox('无项目文档/里程碑数据'); return; }
    function statusColor(s) {
      if (!s) return '#909399';
      if (s.indexOf('延期') > -1) return '#f5222d';
      if (s.indexOf('部分推进') > -1) return '#faad14';
      if (s.indexOf('停滞') > -1) return '#fa8c16';
      if (s.indexOf('推进') > -1 || s.indexOf('按计划') > -1 || s.indexOf('完成') > -1) return '#52c41a';
      return '#909399';
    }
    var rows = all.map(function (item) {
      var ms = item.ms;
      var color = statusColor(ms.status);
      return '<tr>'
        + '<td>' + esc(ms.name) + '</td>'
        + '<td>' + esc(item.repo) + '</td>'
        + '<td>' + esc(ms.owner || '—') + '</td>'
        + '<td>' + esc(ms.due || '—') + '</td>'
        + '<td style="color:' + color + '; font-weight:600; white-space:nowrap;">' + esc(ms.status || '—') + '</td>'
        + '<td>' + esc(ms.note || '') + '</td>'
        + '</tr>';
    }).join('');
    box.innerHTML = '<table><thead><tr><th>里程碑</th><th>仓库</th><th>负责人</th><th>截止</th><th>状态</th><th>摘要</th></tr></thead><tbody>' + rows + '</tbody></table>';
  })();

  /* 模块 10：深度评估要点 */
  (function () {
    var box = el('insightsWrap');
    var repos = DATA.repos || [];
    var hasAny = repos.some(function (r) { return r.insights && r.insights.length; });
    if (!hasAny) { box.innerHTML = emptyBox('无深度评估要点'); return; }
    box.innerHTML = repos.map(function (r) {
      if (!r.insights || !r.insights.length) return '';
      return '<div class="insight-group"><div class="q-title">' + esc(r.name) + '</div><ul>'
        + r.insights.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('')
        + '</ul></div>';
    }).join('');
  })();

  /* 模块 11：footer 生成时间 */
  (function () {
    var m = DATA.meta || {};
    el('footerMeta').textContent = '生成时间：' + (m.runAt || m.date || '—');
  })();

  /* 统一响应窗口尺寸变化 */
  window.addEventListener('resize', function () {
    charts.forEach(function (c) { c.resize(); });
  });
})();
</script>
</body>
</html>
